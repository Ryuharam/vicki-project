services:
  nginx-image:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    container_name: nginx-app
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /home/ubuntu/certs:/etc/nginx/certs
  
  postgresql:
    image: postgres:18
    restart: always
    shm_size: '1gb' # 호스트 RAM의 25% ~ 40% 권장
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env
    environment:
        POSTGRES_USER: ${RDB_USER}
        POSTGRES_PASSWORD: ${RDB_PASSWORD}
        POSTGRES_DB: ${RDB_DATABASE}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # initdb 중 뜨는 임시 서버는 TCP를 열지 않으므로 127.0.0.1 로 확인해야
      # 진짜 서버가 뜬 시점만 healthy 로 잡힙니다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s


  app-image:
    image: ${DOCKER_USERNAME}/vicki-app:latest
    container_name: vicki-app
    env_file:
      - .env
    volumes:
      - ./secret/github-app.pem:${GITHUB_KEY_FILE_PATH}:ro


volumes:
  postgres-data: