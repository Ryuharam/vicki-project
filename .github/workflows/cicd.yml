name: CICD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Install dependencies
        run: uv sync

      - name: Test with pytest
        run: uv run pytest
  
  docker:
    needs: test

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v6

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN}}
      
      - name: Build and Push Docker Image
        run: |
          docker build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/vicki-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/vicki-app:latest
  
  deploy:
    needs: docker

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v6

      - name: Prepare SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Create .env
        run: |
          cat > .env <<EOF
          APP_ENV=prod
          WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }}
          GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}
          GITHUB_KEY_FILE_PATH=/run/secret/github-app.pem
          LLM_PRIMARY=${{ secrets.LLM_PRIMARY }}
          LLM_FALLBACKS=${{ secrets.LLM_FALLBACKS }}
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          LITE_MODEL=ollama:gemma4:e2b
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          LANGSMITH_TRACING=true
          LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT=${{ secrets.LANGSMITH_PROJECT }}
          LOG_LEVEL=ERROR
          EOF
      
      - name: Copy nginx.conf, docker-compose.yml, .env
        run: |
          scp -i ~/.ssh/id_rsa docker-compose.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/

          scp -i ~/.ssh/id_rsa nginx.conf \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/

          scp -i ~/.ssh/id_rsa .env \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/

      - name: Deploy to EC2 via Docker Compose
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            
            mkdir -p /home/${{ secrets.SERVER_USER }}/secret
            cd /home/${{ secrets.SERVER_USER }}/secret
            echo "${{ secrets.GH_KEY_FILE }}" > github-app.pem

            mkdir -p /home/${{ secrets.SERVER_USER }}/certs
            cd /home/${{ secrets.SERVER_USER }}/certs
            echo "${{ secrets.CLOUDFLARE_ORIGIN_KEY }}" > origin.pem
            echo "${{ secrets.CLOUDFLARE_PRIVATE_KEY }}" > private.key

            cd /home/${{ secrets.SERVER_USER }}

            docker compose pull

            docker compose up -d --remove-orphans

            sleep 10
            docker compose ps
          EOF
          